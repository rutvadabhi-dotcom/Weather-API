<html>
    <header>
        <title>
            Weather API
        </title>
    </header>
    <body style="color: #741d03; background-color: rgb(210, 228, 182);">
        <h1 style="color: rgba(10, 10, 10, 0.892);">
            Check the weather of any city
        </h1>
        
        <div>
            <input type="text" id="city" placeholder="Enter city name" />
            <button id="submit">Submit</button>
        </div>
        
        <div>
            <h3 id="cityLocation"></h3>
            <h3 id="cityTime"></h3>
            <h3 id="cityTemp"></h3>
            <h3 id="cityHum"></h3>
            <h3 id="cityWind"></h3>
            
        </div>
        <script src="script.js"></script>
    </body>
</html>
